<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="3C Trix Studio">
  <defs>
    <path id="trix-bottom-arc" d="M 28 100 A 72 72 0 1 0 172 100" fill="none" />
  </defs>

  <!-- Anéis -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#8FA38A" stroke-width="2.4" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#8FA38A" stroke-width="1" stroke-opacity="0.55" />

  <!-- Monograma 3C -->
  <text x="100" y="112" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="600"
        letter-spacing="-2" fill="#0B4F1C">3C</text>

  <!-- Texto curvado inferior -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="500"
        letter-spacing="4" fill="#0B4F1C">
    <textPath href="#trix-bottom-arc" startOffset="50%" text-anchor="middle">TRIX STUDIO</textPath>
  </text>

  <!-- Acentos laterais -->
  <circle cx="18.5" cy="100" r="2.1" fill="#8FA38A" />
  <circle cx="181.5" cy="100" r="2.1" fill="#8FA38A" />
